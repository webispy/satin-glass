name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engines:
        description: Browser engines for e2e (comma-separated)
        default: chromium,webkit,firefox

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages (CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the commits this push or pull request brings. After a force-push the old head is gone from the repository,
      # and a new branch has none: then everything since the last release tag is checked
      - name: Check subjects, wrapping and trailers
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          FROM="${BASE:-$BEFORE}"
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            FROM="$(git describe --tags --abbrev=0 --match 'v*' "$HEAD")"
            echo "no earlier head to compare with: checking since $FROM"
          fi
          node scripts/check-commits.mjs "$FROM..$HEAD"
  check:
    name: Build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Docs option tables match the types, every option described
        run: node scripts/docs-props.mjs --check
      - run: pnpm test

  # which e2e jobs run: on a pull request, Chromium's quick part in 4 shares; on main (and when run by hand), the full
  # run split by engine, each engine its own jobs side by side: Chromium with the setting variants and English in 6,
  # WebKit and Firefox in 5 each, one suite at a time. The timing phase stays off (shared runners): the full
  # `pnpm e2e` before a release runs it
  plan:
    name: e2e plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          ENGINES: ${{ github.event.inputs.engines }}
        run: |
          node -e '
            const pr = process.env.EVENT === "pull_request";
            const of = { chromium: pr ? 4 : 6, webkit: 5, firefox: 5 };
            /* the input by hand: each engine once, and only ones there are */
            const asked = [...new Set((process.env.ENGINES || "chromium,webkit,firefox").split(",").map((s) => s.trim()).filter(Boolean))];
            const unknown = asked.filter((e) => !(e in of));
            if (unknown.length || !asked.length) { console.error(`engines: ${unknown.join(", ") || "none given"}; choose from ${Object.keys(of).join(", ")}`); process.exit(1); }
            const engines = pr ? ["chromium"] : asked;
            /* WebKit and Firefox draw slower on a shared runner: one suite at a time there, in more jobs */
            const jobs = { webkit: "1", firefox: "1" };
            /* WebKit there stops drawing for 60-200 ms as each wheel turn starts (Chromium and Firefox on the same
               runner draw every 16.7 ms), so the frame-by-frame checks of the wheel lens read its squeeze between frames;
               they run in WebKit on macOS before every push (#113) */
            const skip = { webkit: "wheel-motion.mjs" };
            const include = engines.flatMap((engine) => Array.from({ length: of[engine] }, (_, i) => ({ engine, shard: i + 1, of: of[engine], full: pr ? "" : "1", jobs: jobs[engine] ?? "", skip: skip[engine] ?? "" })));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
            console.log(include.map((j) => `${j.engine} ${j.shard}/${j.of}`).join("\n"));
          '

  e2e:
    needs: plan
    name: e2e ${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # browsers and their system libraries come with the image (installing them took from 20 s to over 4 min);
    # keep the tag in step with the playwright version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_ENGINES: ${{ matrix.engine }}
      E2E_FULL: ${{ matrix.full }}
      E2E_JOBS: ${{ matrix.jobs }}
      E2E_SKIP: ${{ matrix.skip }}
      E2E_TIMING: '0'
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter docs build
      # WebKit on a shared runner misses one timing check or another in most runs (#113): its failed checks are
      # reported as warnings on the run and in the job's summary, and neither the job nor the commit turns red; WebKit
      # is checked on macOS before every push. Only the suites that measure motion as it happens (run.mjs's motion
      # phase) are downgraded, and only when one ran to its end and failed by its own checks; anything else (a
      # setup or build step, another suite, a crash, a page or console error) still turns the job red
      - id: e2e
        run: node tests/e2e/run.mjs
        continue-on-error: ${{ matrix.engine == 'webkit' }}
      - name: Report WebKit's failed checks as warnings (#113)
        if: steps.e2e.outcome == 'failure' && matrix.engine == 'webkit'
        run: |
          node -e '
            const fs = require("fs"), file = "tests/e2e/last-run.log";
            const log = fs.existsSync(file) ? fs.readFileSync(file, "utf8").replace(/\r\n?/g, "\n") : "";
            /* each failed suite: its phase and how it ended (run.mjs writes them under the heading), its failed checks
               and its last line */
            const suites = log.split(/^(?==== )/m).filter((b) => b.startsWith("=== FAIL")).map((b) => {
              const lines = b.split("\n"), how = /^--- phase (\w+), (exit|signal) (\S+)/.exec(lines[1] || "") || [];
              return { name: lines[0].slice(8).trim().replace(/\s+\(\d+s\)$/, ""), phase: how[1], exit: how[2] === "exit" ? how[3] : `signal ${how[3]}`,
                last: lines.slice(2).filter((l) => l.trim()).pop() || "",
                checks: [...new Set(lines.filter((l) => /^FAIL [^ ]/.test(l)).map((l) => l.slice(5)))] };
            });
            /* a warning only for a suite of the motion phase (it measures animation as it happens: #113) that ran to its
               end and failed by its own checks: exit 1, its last line the count of failed checks, and none of them a
               page or console error. Anything else fails the job */
            const why = (s) => s.phase !== "motion" ? "a failed check in a suite that does not measure motion"
              : s.exit !== "1" ? `ended with ${s.exit}` : /^all passed$/i.test(s.last.trim()) ? "failed after all its checks passed"
              : !/^\d+ (CHECKS )?FAILED$/i.test(s.last.trim()) ? "stopped before its end"
              : !s.checks.length ? "failed without a failed check" : s.checks.some((c) => /page error|console error/i.test(c)) ? "a page error" : "";
            const esc = (s) => s.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const md = ["### WebKit on a CI runner: failed checks (#113)", "", "Motion suites only; reported, not failing the job: WebKit is checked on macOS before every push. Every failed check is listed here (the run shows at most 10 as warnings).", ""];
            const errors = [];
            for (const s of suites) {
              const w = why(s);
              if (w) { errors.push(`${s.name}: ${w}${s.checks.length ? ` (${s.checks.join("; ")})` : ""}`); continue; }
              md.push(`- **${s.name}**`);
              for (const c of s.checks) { console.log(`::warning title=WebKit on a CI runner (#113)::${esc(`${s.name}: ${c}`.slice(0, 900))}`); md.push(`  - ${c.replace(/\|/g, "\\|")}`); }
            }
            /* no failed suite at all: the run stopped before the suites, or wrote no log */
            if (!suites.length) errors.push(`no failed suite in ${file} (the run stopped before the suites, or wrote no log)`);
            if (errors.length) md.push("", "**Failing the job:**", "");
            for (const e of errors) { console.log(`::error title=WebKit e2e::${esc(e.slice(0, 900))}`); md.push(`- ${e.replace(/\|/g, "\\|")}`); }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
            process.exitCode = errors.length ? 1 : 0;
          '
      - name: Keep the failures (with engine, settings and load) for FLAKES.md
        if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/e2e/failures/
          retention-days: 30
