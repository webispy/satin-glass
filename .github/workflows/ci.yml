name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engines:
        description: Browser engines for e2e (comma-separated)
        default: chromium,webkit,firefox

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages (CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the commits this push or pull request brings (a new branch: none to compare against, so nothing is checked)
      - name: Check subjects, wrapping and trailers
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          FROM="${BASE:-$BEFORE}"
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then echo "no range to check"; exit 0; fi
          node scripts/check-commits.mjs "$FROM..$HEAD"
  check:
    name: Build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Docs option tables match the types, every option described
        run: node scripts/docs-props.mjs --check
      - run: pnpm test

  e2e:
    name: e2e ${{ matrix.shard }}/4 (${{ github.event.inputs.engines || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # browsers and their system libraries come with the image (installing them took from 20 s to over 4 min);
    # keep the tag in step with the playwright version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_ENGINES: ${{ github.event.inputs.engines || 'chromium' }}
      E2E_TIMING: '0'
      E2E_SHARD: ${{ matrix.shard }}/4
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter docs build
      - run: node tests/e2e/run.mjs
