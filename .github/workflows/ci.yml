name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      engines:
        description: Browser engines for e2e (comma-separated)
        default: chromium,webkit,firefox

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages (CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the commits this push or pull request brings. After a force-push the old head is gone from the repository,
      # and a new branch has none: then everything since the last release tag is checked
      - name: Check subjects, wrapping and trailers
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          FROM="${BASE:-$BEFORE}"
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            FROM="$(git describe --tags --abbrev=0 --match 'v*' "$HEAD")"
            echo "no earlier head to compare with: checking since $FROM"
          fi
          node scripts/check-commits.mjs "$FROM..$HEAD"
  check:
    name: Build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Docs option tables match the types, every option described
        run: node scripts/docs-props.mjs --check
      - run: pnpm test

  e2e:
    name: e2e ${{ matrix.shard }}/4 (${{ github.event.inputs.engines || 'chromium' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # browsers and their system libraries come with the image (installing them took from 20 s to over 4 min);
    # keep the tag in step with the playwright version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_ENGINES: ${{ github.event.inputs.engines || 'chromium' }}
      E2E_TIMING: '0'
      E2E_SHARD: ${{ matrix.shard }}/4
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter docs build
      - run: node tests/e2e/run.mjs
      - name: Keep the failures (with engine, settings and load) for FLAKES.md
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: tests/e2e/failures/
          retention-days: 30
